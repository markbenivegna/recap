name: Compile Icon Composer bundle

on:
  workflow_dispatch: {}
  push:
    branches: [master]
    paths: [".github/workflows/compile-icon.yml"]

jobs:
  compile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run actool
        run: |
          mkdir -p out
          xcrun actool assets/AppIcon.icon \
            --app-icon AppIcon \
            --compile out \
            --output-partial-info-plist out/partial-info.plist \
            --minimum-deployment-target 15.0 \
            --platform macosx \
            --target-device mac

      - name: Upload Assets.car
        uses: actions/upload-artifact@v4
        with:
          name: AppIcon-assets-car
          path: out/Assets.car
