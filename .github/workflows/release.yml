name: Release

# Push a version tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`) to
# build a real, standalone Recap.app and publish it as a GitHub Release —
# this is the actual release process; scripts/recap.spec is never meant to
# be built by hand for a real release, only for local testing.
on:
  push:
    tags:
      - "v*"

# The default GITHUB_TOKEN is read-only unless a workflow explicitly asks
# for more — needed here for `gh release create` to actually publish.
permissions:
  contents: write

jobs:
  build:
    # GitHub-hosted macOS runners are Apple Silicon (arm64) and come with
    # Homebrew preinstalled — both scripts/recap.spec (target_arch="arm64")
    # and scripts/bundle_ffmpeg.sh (needs `brew`) depend on that.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install Homebrew build/runtime deps
        run: brew install ffmpeg dylibbundler

      - name: Install Python dependencies
        run: |
          python3 -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install -r requirements.txt
          venv/bin/pip install -r requirements-build.txt

      - name: Build Recap.app
        run: venv/bin/pyinstaller scripts/recap.spec --noconfirm --distpath dist --workpath build

      - name: Bundle ffmpeg into Recap.app
        run: scripts/bundle_ffmpeg.sh dist/Recap.app

      - name: Re-sign Recap.app
        # bundle_ffmpeg.sh copies ffmpeg + its dylibs into the bundle AFTER
        # recap.spec's own BUNDLE step already signed it, which invalidates
        # that outer signature (the seal no longer matches the bundle's
        # actual contents). codesign -v alone doesn't catch this locally
        # because the "sealed resource is missing or invalid" check only
        # runs when the file is quarantined — i.e. only after a real
        # browser download, never on a locally built or hot-patched copy.
        # Confirmed via `spctl -a -vv`: without this step, a downloaded
        # Recap.app shows macOS's fatal "is damaged, move to Trash" dialog
        # (no override); with it, the normal, expected, one-time
        # "Apple could not verify..." dialog with a real Open Anyway path.
        run: codesign --deep --force -s - dist/Recap.app

      - name: Zip Recap.app
        # ditto (not plain zip) preserves the bundle's resource forks/xattrs
        # and codesign metadata correctly — the standard way to zip a real
        # macOS .app for distribution.
        run: ditto -c -k --sequesterRsrc --keepParent dist/Recap.app Recap.app.zip

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" Recap.app.zip \
            --title "Recap ${{ github.ref_name }}" \
            --notes "Download and unzip, then try to open it — macOS will block it since Recap isn't notarized (a normal one-time step for an app downloaded outside the App Store, not a warning sign). Go to System Settings → Privacy & Security → Security and click Open Anyway next to the mention of Recap, confirm once more, and it opens normally after that. See the README for the full first-launch walkthrough."
