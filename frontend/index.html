<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Recap</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">
  <header class="toolbar">
    <h1><img src="/icon.png" alt="" class="app-icon" />Recap</h1>
    <div class="record-controls">
      <div id="waveform" class="waveform" hidden>
        <span class="waveform-bar"></span>
        <span class="waveform-bar"></span>
        <span class="waveform-bar"></span>
        <span class="waveform-bar"></span>
        <span class="waveform-bar"></span>
      </div>
      <span id="timer" class="timer" hidden>00:00</span>
      <button id="newRecordingBtn" class="btn btn-primary" hidden>New Recording</button>
      <button id="recordBtn" class="btn btn-record">Record</button>
      <label id="uploadLabel" class="btn btn-secondary file-label">
        Upload audio
        <input id="fileInput" type="file" accept="audio/*" hidden />
      </label>
      <button id="settingsBtn" class="btn btn-icon" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"></path>
          <path d="M18.727 14.727a1.5 1.5 0 0 0 .3 1.655l.055.054a1.816 1.816 0 0 1 0 2.573 1.818 1.818 0 0 1-2.573 0l-.055-.055a1.5 1.5 0 0 0-1.654-.3 1.5 1.5 0 0 0-.91 1.373v.155a1.818 1.818 0 1 1-3.636 0V20.1a1.5 1.5 0 0 0-.981-1.373 1.5 1.5 0 0 0-1.655.3l-.054.055a1.818 1.818 0 0 1-3.106-1.287 1.818 1.818 0 0 1 .533-1.286l.054-.055a1.5 1.5 0 0 0 .3-1.654 1.5 1.5 0 0 0-1.372-.91h-.155a1.818 1.818 0 1 1 0-3.636H3.9a1.5 1.5 0 0 0 1.373-.981 1.5 1.5 0 0 0-.3-1.655l-.055-.054A1.818 1.818 0 1 1 7.491 4.99l.054.054a1.5 1.5 0 0 0 1.655.3h.073a1.5 1.5 0 0 0 .909-1.372v-.155a1.818 1.818 0 0 1 3.636 0V3.9a1.499 1.499 0 0 0 .91 1.373 1.5 1.5 0 0 0 1.654-.3l.054-.055a1.817 1.817 0 0 1 2.573 0 1.819 1.819 0 0 1 0 2.573l-.055.054a1.5 1.5 0 0 0-.3 1.655v.073a1.5 1.5 0 0 0 1.373.909h.155a1.818 1.818 0 0 1 0 3.636H20.1a1.499 1.499 0 0 0-1.373.91Z"></path>
        </svg>
      </button>
    </div>
  </header>

  <div id="settingsModal" class="modal-overlay" hidden>
    <div class="modal">
      <button id="settingsCloseBtn" class="modal-close" type="button" aria-label="Close">&times;</button>
      <h2 id="settingsHeading">Settings</h2>
      <p id="settingsIntro" class="modal-intro" hidden>
        Add your API keys to get started — nothing here leaves your Mac except direct calls to Anthropic/Notion.
      </p>
      <form id="settingsForm">
        <label class="field">
          <span>Anthropic API key</span>
          <small><a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a> → API Keys</small>
          <input type="password" id="cfgAnthropicKey" autocomplete="off" />
        </label>
        <label class="field">
          <span>Notion API key</span>
          <small><a href="https://www.notion.so/my-integrations" target="_blank">notion.so/my-integrations</a> → New integration. Then connect it to specific pages from within Notion itself (page's <code>...</code> menu → Connections).</small>
          <input type="password" id="cfgNotionKey" autocomplete="off" />
        </label>
        <label class="field">
          <span>Whisper model size</span>
          <small>Applies next time you restart Recap.</small>
          <select id="cfgWhisperSize">
            <option value="base">base (fastest)</option>
            <option value="small">small (default)</option>
            <option value="medium">medium (most accurate)</option>
          </select>
        </label>
        <label class="field">
          <span>Vocabulary hints</span>
          <small>Comma-separated names/jargon Whisper tends to mishear. Applies next restart.</small>
          <input type="text" id="cfgVocabHints" placeholder="e.g. Mando Man, RenoPinball" />
        </label>
        <label class="field">
          <span>Recording output device</span>
          <small>Exact Multi-Output Device name for system-audio auto-switching (optional). See README.</small>
          <input type="text" id="cfgOutputDevice" />
        </label>
        <div class="modal-actions">
          <button type="button" id="settingsCancelBtn" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
        <p id="settingsStatus" class="file-status"></p>
      </form>
    </div>
  </div>

  <div id="status" class="status" hidden>
    <span id="statusSpinner" class="spinner" hidden></span>
    <span id="statusText"></span>
  </div>

  <main class="content">
    <div id="empty" class="empty-state">
      Record a meeting or upload an audio file to get started.
    </div>

    <div id="results" hidden>
      <h2 id="meetingTitle" class="meeting-title" hidden></h2>
      <nav class="tabs">
        <button class="tab-btn active" data-tab="summary">Summary</button>
        <button class="tab-btn" data-tab="notes">Notes</button>
        <button class="tab-btn" data-tab="transcript">Transcript</button>
      </nav>

      <section id="tab-summary" class="tab-panel active">
        <div id="summaryContent" class="panel-content"></div>
      </section>

      <section id="tab-notes" class="tab-panel">
        <div id="notesContent" class="panel-content"></div>
      </section>

      <section id="tab-transcript" class="tab-panel">
        <div id="transcriptContent" class="panel-content transcript"></div>
      </section>

      <footer class="file-bar">
        <span id="notionFileGroup" class="notion-file-group" hidden>
          <span class="split-btn">
            <button id="fileBtn" class="btn btn-primary split-btn-main" disabled>File to Notion</button>
            <select id="notionSelect" class="split-btn-select" aria-label="Notion destination page">
              <option value="">Loading pages...</option>
            </select>
            <span class="split-btn-caret" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </span>
          </span>
        </span>
        <button id="downloadBtn" class="btn btn-secondary">Save Markdown</button>
        <span id="notionHint" class="file-status" hidden>Connect Notion in Settings to file notes there directly.</span>
        <span id="fileStatus" class="file-status"></span>
      </footer>
    </div>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
